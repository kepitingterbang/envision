<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>envision</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
</head>
<body>
    <header class="nav">
        <div class="nav-inner">
        <a href="index.html" class="brand">
            <span class="brand-first">en</span>
            <span class="brand-second">vison</span>
        </a>
        <!-- menu -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
        </label>

        <ul class="menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Product</a></li>
            <li><a href="">Rewards</a></li>
            <li><a href="">About</a></li>
            <form action=""class="search">
                <input type="search" placeholder="search..." required>
                <button type="submit">
                    <svg width="35" height="35" viewBox="0 0 35 35" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30.625 30.625L24.2812 24.2812M27.7083 16.0417C27.7083 22.485 22.485 27.7083 16.0417 27.7083C9.59834 27.7083 4.375 22.485 4.375 16.0417C4.375 9.59834 9.59834 4.375 16.0417 4.375C22.485 4.375 27.7083 9.59834 27.7083 16.0417Z" stroke="#1B1F22" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
        
                </button>
                </form>
                <button class="nav-btn">
                    <a href="#" class="btn">
                        <svg width="35" height="33" viewBox="0 0 35 33" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1H6.83333L10.7417 20.5271C10.875 21.1985 11.2403 21.8016 11.7735 22.2309C12.3067 22.6601 12.9739 22.8881 13.6583 22.875H27.8333C28.5177 22.8881 29.1849 22.6601 29.7182 22.2309C30.2514 21.8016 30.6166 21.1985 30.75 20.5271L33.0833 8.29167H8.29167M14.125 30.1667C14.125 30.9721 13.4721 31.625 12.6667 31.625C11.8613 31.625 11.2083 30.9721 11.2083 30.1667C11.2083 29.3613 11.8613 28.7083 12.6667 28.7083C13.4721 28.7083 14.125 29.3613 14.125 30.1667ZM30.1667 30.1667C30.1667 30.9721 29.5137 31.625 28.7083 31.625C27.9029 31.625 27.25 30.9721 27.25 30.1667C27.25 29.3613 27.9029 28.7083 28.7083 28.7083C29.5137 28.7083 30.1667 29.3613 30.1667 30.1667Z" stroke="#1B1F22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </a>
                </button>
        </ul>
        </div>
    </header>

    <main>
        <h2 class="checkout_trigger">checkout</h2>
        <div class="cart-step">
            <a href="" class="cart-inactive">
                <div class="num">1</div>
                <h2>shopping-cart</h2>
            </a>
            <a href="" class="cart-active">
                <div class="num">2</div>
                <h2>checkout-detail</h2>
            </a>

            <div class="cart-inactive">
                <div class="num">3</div>
                <h2>order-complete</h2>
            </div>
        </div>

        <div class="checkout-container">
            <div class="left-items">
                <form action="" id="checkout-user-detail">
                    <h2>Billing Details</h2>
                    <div class="form">
                        <input type="email" id="form-email" placeholder="Email Address">
                        <span class="error-message"></span>
                    </div>
                    <div class="form">
                        <input type="text" id="form-name" placeholder="Full Name">
                        <span class="error-message"></span>
                    </div>
                    <div class="form">
                        <select id="payment-method">
                            <option value="transfer">Transfer</option>
                            <option value="cash">Cash</option>
                        </select>
                    </div>
                    <div class="note">
                        <textarea name="" id="note" placeholder="Note about your order"></textarea>
                    </div>
                </form>
            </div>

            <div class="right-items">
                <div class="summary">
                    <div class="cek_title">Order Summary</div>
                    <div class="quantity-total"></div>
                    <div class="cart-items"></div>
                    <h3>Cart Total</h3>
                    <p>Subtotal <span class="cek_subtotal"></span></p>
                    <p>Delivery Fee <span>Free</span></p>
                    <p>Grand Total <span class="cek_grand-total"></span></p>
                </div>

                <div class="card-payment-section hidden" id="card-payment-section">
                    <h2>Card payment</h2>
                    <div class="form">
                        <span>Card number</span>
                        <input type="text" id="card-number" placeholder="1234 5678 9012 3456">
                        <span class="error-message"></span>
                    </div>
                    <div class="card-row">
                        <div class="form">
                            <span> Expiry date</span>
                            <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5">
                            <span class="error-message"></span>
                        </div>
                        <div class="form">
                            <span>CVV</span>
                            <input type="text" id="card-cvv" placeholder="CVV" maxlength="4">
                            <span class="error-message"></span>
                        </div>
                    </div>
                </div>
                <button type="button" id="place-order-btn" class="checkout-btn">Place Order</button>
            </div>
        </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
